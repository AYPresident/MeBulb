name: Build and test
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: PDF tools used by the tests
        run: sudo apt-get update && sudo apt-get install -y qpdf poppler-utils
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - name: Keep the web build
        uses: actions/upload-artifact@v4
        with:
          name: mebulb-web
          path: dist/mebulb.html
      - name: Keep test screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-screenshots
          path: test/out/*.png
